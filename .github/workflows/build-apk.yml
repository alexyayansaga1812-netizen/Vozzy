name: Generar APK de Android (Tlahto)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar assets y proyecto Android con Capacitor
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd capacitor-app
          node sync-www.js
          npm install
          npx cap telemetry off
          npx cap add android || true
          npx cap sync android

      - name: Declarar queries de TTS en AndroidManifest
        run: |
          python3 -c "
          manifest_path = 'capacitor-app/android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          if 'TTS_SERVICE' not in content:
              queries_tag = '<queries><intent><action android:name=\"android.intent.action.TTS_SERVICE\" /></intent></queries>\n</manifest>'
              new_content = content.replace('</manifest>', queries_tag)
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print('Bloque TTS_SERVICE inyectado con exito en AndroidManifest.xml')
          else:
              print('TTS_SERVICE ya declarado en AndroidManifest.xml')
          "

      - name: Dar permisos de ejecucion a Gradlew
        run: |
          cd capacitor-app/android
          chmod +x gradlew

      - name: Compilar APK Debug con Gradle
        run: |
          cd capacitor-app/android
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: Tlahto-Android-APK
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
